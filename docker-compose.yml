services:
  homeassistant:
    container_name: homex-ha
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      # The integration lives at the repo root (HACS layout); mount it into
      # the dev config dir so HA loads it from there.
      - ./custom_components:/config/custom_components
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8124:8123"
    restart: unless-stopped
    environment:
      - TZ=Europe/Paris

  # MQTT broker of the Zigbee2MQTT simulator.
  mosquitto:
    container_name: homex-mosquitto
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config:/mosquitto/config
    ports:
      - "1884:1883"
    restart: unless-stopped

  # Zigbee2MQTT simulator: the mock house (dev/mock/house.py) published like
  # Zigbee2MQTT does, with lights, switches, shutters, valves and sensors.
  z2m-sim:
    container_name: homex-z2m-sim
    build: ./dev/mock
    environment:
      - MQTT_HOST=mosquitto
    depends_on:
      - mosquitto
    restart: unless-stopped

